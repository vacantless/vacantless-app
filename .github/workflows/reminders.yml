name: Vacantless background sweeps

# Free external pinger for the Vacantless cron sweeps. Vercel Hobby caps native
# cron at once/day, which can't drive the ~2h reminder, so this GitHub Actions
# schedule hits the idempotent sweep endpoints every 15 minutes. Each route only
# acts on rows whose sent-at column is still null, so frequent pings are safe
# and compose with the daily Vercel cron.
#
#   * /api/cron/reminders — 24h + 2h showing reminders (M3)
#   * /api/cron/feedback  — post-showing feedback requests (M5)
#   * /api/cron/nurture   — lead nurture drip to un-booked inquiries (M5)
#   * /api/cron/leasing-snapshot — daily weekday leasing digest (self-gates to
#     once/day at the org's start-of-shift hour via leasing_snapshot_last_sent_on)
#   * /api/cron/viewing-reminder — weekly viewing-times reminder (self-gates to
#     the org's chosen weekday/hour and stays quiet when the next week is covered)
#   * /api/cron/availability-tripwire — same-day zero/thin viewing availability
#     alert (edge-triggered per org, opt-in, owner_admin always copied)
#   * /api/cron/availability-reopened-notify — renter-facing notify to waiting
#     no-suitable-time leads after an operator opens bookable capacity
#   * /api/cron/reschedule-nudge — one re-send of an unresponded pending
#     reschedule proposal 24h after creation; opt-in per org and capped per row
#   * /api/cron/rent-increase — per-tenancy N1 reminder (self-gates to once per
#     increase cycle via tenancies.rent_increase_nudged_for)
#   * /api/cron/compliance-calendar — seasonal soft tenant courtesy notes (drafts
#     into pending_tenant_messages on the season window; dark unless
#     COMPLIANCE_CALENDAR_ENABLED=true and the org's compliance_calendar_enabled
#     flag is true; event settings still gate each item; self-gates to once/season
#     via the pending_tenant_messages dedupe index)
#   * /api/cron/document-retention — permanently purges soft-deleted vault
#     documents past their retention window (documents.retention_until); acts only
#     on already soft-deleted rows, so frequent pings are safe
#   * /api/cron/appointment-reminder — repair-appointment reminders to the tenant
#     (day-before + same-day) off a confirmed work_order_appointments row; opt-in
#     per org+event, self-gates via the per-channel reminder_* stamp columns
#   * /api/cron/showing-confirmation-nudge — one "please confirm this viewing"
#     email to the assigned agent when an upcoming viewing is still unconfirmed
#     (self-gates per org via the notification opt-in; S440)
#   * /api/cron/showing-outcome-nudge — one "how did the viewing go?" email to the
#     operator once a showing's time passes with no outcome recorded; opt-in per
#     org+event, one nudge per showing via the outcome_nudge_sent_at stamp
#   * /api/cron/distribution-freshness — re-checks Vacantless-owned distribution
#     proof and flags stale external portal rows for manual refresh; dark unless
#     DISTRIBUTION_FRESHNESS_ENABLED=true
#   * /api/cron/distribution-worker — done-for-you posting worker: prepares one
#     authorized concierge job and stops at the human gate; dark unless
#     DISTRIBUTION_WORKER_ENABLED=true AND the channel is automation_authorized
#     (S553). Never logs in, pays, submits, or sets live.
#   * /api/cron/smart-lock-battery — recurring smart-lock battery reminder for
#     units flagged has_smart_lock; opt-in per org+event and self-gates via the
#     unit's last_smart_lock_battery_reminder_at stamp
#   * /api/cron/tenant-message-outbox — dispatches due scheduled/undo tenant
#     messages after an atomic outbox claim; dark unless
#     TENANT_COMMS_OUTBOX_ENABLED=true
#
# SETUP (one-time, Noam):
#   GitHub repo → Settings → Secrets and variables → Actions → New repository
#   secret → name CRON_SECRET, value = the same CRON_SECRET set in Vercel env.
#
# WHY EVERY STEP CARRIES RETRIES AND AN if-GUARD (S672, 2026-08-22):
# run #933 failed with curl exit 35, an SSL connect error on the handshake to
# vercel.app. Nothing was wrong with the app or the deploy; the runner's network
# blipped. Two consequences were worth fixing, neither of them the blip itself.
#   1. A bare `curl -sS` under `bash -e` fails the step on any transient fault.
#      `--retry-all-errors` is the flag that matters here: plain `--retry` does
#      NOT retry an SSL connect error, so it would not have caught this one.
#   2. Steps run sequentially, so one failed step SKIPPED THE REMAINING SWEEPS
#      for that cycle. `if: not cancelled()` lets the other endpoints still get
#      pinged while the job as a whole still reports failure.
# Deliberately NOT used: continue-on-error, which would make the job green and
# hide a real outage. A persistent fault still fails this workflow, loudly.
# Retrying is safe because every route is idempotent and acts only on rows whose
# sent-at column is still null. `--max-time 90` sits above Vercel's own function
# ceiling, so it can never cut short a request the platform would have allowed.
#
# Note: GitHub-scheduled runs can be delayed under load and are auto-disabled
# after 60 days with no repo commits — fine for an active repo. When Vacantless
# takes its first external paying customer, move to Vercel Pro native cron
# (*/15 * * * * in vercel.json) and delete this workflow.

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch: {} # lets you trigger the sweeps manually from the Actions tab

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger reminder sweep
        if: ${{ !cancelled() }}
        run: |
          curl -sS --retry 3 --retry-delay 5 --retry-all-errors --max-time 90 -X GET \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            "https://vacantless-app.vercel.app/api/cron/reminders" \
            -w "\nHTTP %{http_code}\n"
      - name: Trigger feedback sweep
        if: ${{ !cancelled() }}
        run: |
          curl -sS --retry 3 --retry-delay 5 --retry-all-errors --max-time 90 -X GET \
