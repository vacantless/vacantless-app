name: Listing-post live check

# Daily check that every `live` listing_posts row on Kijiji, Zumper and
# Rentals.ca still points at an ad (S693). The route is report-only until
# LISTING_POST_LIVE_CHECK_ENABLED=true is set in Vercel; with the flag off the
# run prints verdicts and writes nothing. Uses the same repo secret CRON_SECRET
# as reminders.yml. Deliberately NOT in the 15-minute pinger: one fetch per row
# per day is enough and keeps Vercel's egress off the portals' radar.
#
# Run it by hand: Actions tab -> "Listing-post live check" -> Run workflow.

on:
  schedule:
    - cron: "30 14 * * *"
  workflow_dispatch: {}

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Listing-post live check
        run: |
          curl -sS --retry 3 --retry-delay 5 --retry-all-errors --max-time 90 -X GET \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            "https://vacantless-app.vercel.app/api/cron/listing-post-live-check" \
            -w "\nHTTP %{http_code}\n"
