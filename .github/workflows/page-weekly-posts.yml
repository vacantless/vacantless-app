name: Facebook Page weekly posts

# S702i: posts each open rental to the landlord's connected Facebook Page once
# a week, for accounts that turned weekly posts on. Runs daily; each rental is
# posted at most once every 7 days. Run by hand: Actions tab -> Run workflow.

on:
  schedule:
    - cron: "45 14 * * *" # 10:45 AM Toronto in summer
  workflow_dispatch: {}

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - name: Page weekly posts
        run: |
          curl -sS --retry 3 --retry-delay 5 --retry-all-errors --max-time 120 -X GET \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            "https://vacantless-app.vercel.app/api/cron/page-weekly-posts" \
            -w "\nHTTP %{http_code}\n"
